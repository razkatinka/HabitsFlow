<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker — Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">

<div class="app-layout">

  <!-- Sidebar (desktop) -->
  <aside class="app-sidebar">
    <div class="app-sidebar-logo">🔥 HabitFlow</div>
    <nav class="app-sidebar-nav">
      <a href="dashboard.html" class="app-nav-item active">📋 Habits</a>
      <a href="history.html"   class="app-nav-item">📊 History</a>
      <a href="plan.html"      class="app-nav-item">🗺️ Plan</a>
      <a href="bio-ages.html"  class="app-nav-item">🧬 Bio Ages</a>
    </nav>
    <div class="app-sidebar-footer">
      <span id="sidebar-email" class="user-email"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="app-main-wrap">

  <!-- Top nav (mobile only) -->
  <header class="topbar">
    <div class="topbar-inner">
      <span class="topbar-logo">🔥 HabitFlow</span>
      <div class="topbar-right">
        <span id="user-email" class="user-email"></span>
        <button class="btn btn-ghost" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="main-content">

    <!-- Date heading -->
    <section class="section-heading">
      <h2 id="today-label">Today</h2>
      <p id="today-date" class="subtext"></p>
    </section>

    <!-- Progress bar -->
    <section class="progress-section">
      <div class="progress-bar-track">
        <div id="progress-bar" class="progress-bar-fill" style="width:0%"></div>
      </div>
      <p id="progress-label" class="progress-label">0 / 0 done</p>
    </section>

    <!-- Add habit button -->
    <section class="add-habit-section">
      <button class="new-habit-btn" onclick="openHabitModal()">
        ✚ Add a Habit
      </button>
      <p id="add-error" class="form-error hidden"></p>
    </section>

    <!-- Habits list -->
    <section class="habits-section">
      <div id="habits-loading" class="loading-msg">Loading habits…</div>
      <div id="habits-empty" class="empty-msg hidden">
        No habits yet. Click <strong>Add a Habit</strong> to get started!
      </div>
      <ul id="habits-list" class="habits-list hidden"></ul>
    </section>

  </main>

  </div><!-- .app-main-wrap -->
</div><!-- .app-layout -->

<!-- ══════════════════════════════════════════════════════
     Habit Picker Modal
═══════════════════════════════════════════════════════ -->
<div id="habit-modal" class="modal-overlay hidden" onclick="closeHabitModal(event)">
  <div class="modal-box habit-modal-box">

    <div class="hm-header">
      <h3>Add a Habit</h3>
      <button class="modal-close" onclick="closeHabitModal()">×</button>
    </div>

    <!-- Category tabs -->
    <div class="hm-tabs" id="hm-tabs">
      <button class="hm-tab active" data-tab="heart"   onclick="switchTab(this)">❤️ Heart</button>
      <button class="hm-tab"        data-tab="brain"   onclick="switchTab(this)">🧠 Brain</button>
      <button class="hm-tab"        data-tab="fitness" onclick="switchTab(this)">💪 Fitness</button>
      <button class="hm-tab"        data-tab="food"    onclick="switchTab(this)">🍽️ Food</button>
      <button class="hm-tab"        data-tab="life"    onclick="switchTab(this)">✨ Life</button>
      <button class="hm-tab"        data-tab="custom"  onclick="switchTab(this)">✏️ Custom</button>
    </div>

    <!-- Heart panel -->
    <div class="hm-panel" id="panel-heart"></div>

    <!-- Brain panel -->
    <div class="hm-panel hidden" id="panel-brain"></div>

    <!-- Fitness panel -->
    <div class="hm-panel hidden" id="panel-fitness"></div>

    <!-- Food panel -->
    <div class="hm-panel hidden" id="panel-food"></div>

    <!-- Life panel -->
    <div class="hm-panel hidden" id="panel-life"></div>

    <!-- Custom panel -->
    <div class="hm-panel hidden" id="panel-custom">
      <form onsubmit="addCustomHabit(event)" class="hm-custom-form">
        <div class="hm-custom-row">
          <input type="text" id="custom-emoji" placeholder="😊" maxlength="2" class="hm-emoji-input" />
          <input type="text" id="custom-name" placeholder="Name your habit…" maxlength="80" required class="hm-name-input" />
        </div>
        <div class="hm-custom-bio">
          <label>Link to Bio Age <span style="font-weight:400;color:var(--text-muted)">(optional)</span></label>
          <select id="custom-bio-field">
            <option value="">No link</option>
            <option value="exercise">❤️💪 Exercise</option>
            <option value="steps_10k">💪 10k Steps</option>
            <option value="stretching">💪 Stretching</option>
            <option value="outdoor">💪 Outdoor Activity</option>
            <option value="reading">🧠 Reading</option>
            <option value="meditation">🧠 Meditation</option>
            <option value="learning">🧠 Learning</option>
            <option value="alcohol">❤️ No Alcohol (inverse)</option>
            <option value="smoking">❤️ No Smoking (inverse)</option>
            <option value="screen_before_bed">🧠 No Screen Before Bed (inverse)</option>
          </select>
        </div>
        <p id="hm-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">+ Add Habit</button>
      </form>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     Streak Modal
═══════════════════════════════════════════════════════ -->
<div id="streak-modal" class="modal-overlay hidden" onclick="closeStreakModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeStreakModal()">×</button>
    <div class="modal-icon">🔥</div>
    <h3 id="modal-habit-name"></h3>
    <p class="modal-streak-label">Current streak</p>
    <p id="modal-streak-count" class="modal-streak-count"></p>
    <p id="modal-streak-sub" class="modal-streak-sub"></p>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     Stats Modal
═══════════════════════════════════════════════════════ -->
<div id="stats-modal" class="modal-overlay hidden" onclick="closeStatsModal(event)">

    <button class="modal-close" onclick="closeStatsModal()">×</button>
    <div id="stats-modal-emoji" class="modal-icon"></div>
    <h3 id="stats-modal-name"></h3>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-val" id="stat-streak">--</div>
        <div class="stat-label">🔥 Streak</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-total">--</div>
        <div class="stat-label">✅ Done (30d)</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-time">--</div>
        <div class="stat-label">⏱ Minutes</div>
      </div>
    </div>
    <p class="stat-calendar-label">Last 14 days</p>
    <div id="stat-calendar" class="stat-calendar"></div>
  </div>
</div>

  // ── Build suggestion panels ─────────────────────────────
  function buildPanels() {
    ["heart", "brain", "fitness", "food", "life"].forEach(cat => {
      const panel = document.getElementById("panel-" + cat);
      if (!panel) return;
      let html = "";
      let dividerAdded = false;
      SUGGESTIONS[cat].forEach((h, i) => {
        if (h.isBad && !dividerAdded) {
          dividerAdded = true;
          html += `<div class="hm-section-divider">⚠️ Bad Habits to Track</div>`;
        }
        const badgeHtml = h.tag
          ? `<span class="hm-badge hm-badge-${cat}">${h.tag}</span>`
          : "";
        html += `
          <div class="hm-row${h.isBad ? " hm-row-bad" : ""}">
            <span class="hm-emoji">${h.emoji}</span>
            <div class="hm-info">
              <div class="hm-name">${escapeHtml(h.name)}</div>
              ${badgeHtml}
            </div>
            <button class="hm-add-btn" id="hm-btn-${cat}-${i}"
              onclick="addSuggestedHabit(this, '${cat}', ${i})">+ Add</button>
          </div>`;
      });
      panel.innerHTML = html;
    });
  }

  // ── Tab switching ───────────────────────────────────────
  function switchTab(btn) {
    document.querySelectorAll(".hm-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    ["heart","brain","fitness","food","life","custom"].forEach(c => {
      const p = document.getElementById("panel-" + c);
      if (p) p.classList.toggle("hidden", c !== tab);
    });
  }

  // ── Open / close modal ──────────────────────────────────
  function openHabitModal() {
    document.getElementById("habit-modal").classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }

  function closeHabitModal(e) {
    if (e && e.target !== document.getElementById("habit-modal") &&
        !e.currentTarget.classList.contains("modal-close")) return;
    document.getElementById("habit-modal").classList.add("hidden");
    document.body.style.overflow = "";
  }

  // ── Add suggested habit ─────────────────────────────────
  async function addSuggestedHabit(btn, cat, idx) {
    const h = SUGGESTIONS[cat][idx];
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const inverse = h.bio_age_inverse !== undefined
        ? h.bio_age_inverse
        : INVERSE_FIELDS.has(h.bio_age_field);
      const habit = await apiFetch("/habits", "POST", {
        name:            h.name,
        emoji:           h.emoji,
        bio_age_field:   h.bio_age_field || null,
        bio_age_inverse: inverse,
      });
      habitsCache.push(habit);
      renderHabits(habitsCache);
      btn.textContent = "✅ Added";
      btn.classList.add("added");
      setTimeout(() => {
        btn.textContent = "+ Add";
        btn.classList.remove("added");
        btn.disabled = false;
      }, 2000);
    } catch (err) {
      btn.textContent = "Error";
      btn.disabled = false;
      setTimeout(() => { btn.textContent = "+ Add"; }, 2000);
    }
  }

  // ── Add custom habit ────────────────────────────────────
  async function addCustomHabit(e) {
    e.preventDefault();
    const name  = document.getElementById("custom-name").value.trim();
    const emoji = document.getElementById("custom-emoji").value.trim() || "✅";
    const field = document.getElementById("custom-bio-field").value;
    const errEl = document.getElementById("hm-error");
    errEl.classList.add("hidden");

    if (!name) return;

    const btn = e.submitter || e.target.querySelector("button[type=submit]");
    if (btn) btn.disabled = true;

    try {
      const inverse = INVERSE_FIELDS.has(field);
      const habit = await apiFetch("/habits", "POST", {
        name,
        emoji,
        bio_age_field:   field || null,
        bio_age_inverse: inverse,
      });
      habitsCache.push(habit);
      renderHabits(habitsCache);
      document.getElementById("custom-name").value  = "";
      document.getElementById("custom-emoji").value = "";
      document.getElementById("custom-bio-field").value = "";
      if (btn) { btn.textContent = "✅ Added!"; }
      setTimeout(() => {
        if (btn) { btn.disabled = false; btn.textContent = "+ Add Habit"; }
      }, 1800);
    } catch (err) {
      errEl.textContent = err.message || "Failed to add habit";
      errEl.classList.remove("hidden");
      if (btn) btn.disabled = false;
    }
  }

  // ── Render helpers ──────────────────────────────────────
  function bioLabel(field) {
    const MAP = {
      exercise:         ["💪 Fitness / ❤️ Heart", "fitness"],
      steps_10k:        ["💪 Fitness",             "fitness"],
      stretching:       ["💪 Fitness",             "fitness"],
      outdoor:          ["💪 Fitness",             "fitness"],
      reading:          ["🧠 Brain",               "brain"],
      meditation:       ["🧠 Brain",               "brain"],
      learning:         ["🧠 Brain",               "brain"],
      screen_before_bed:["🧠 Brain",               "brain"],
      alcohol:          ["❤️ Heart",               "heart"],
      smoking:          ["❤️ Heart",               "heart"],
    };
    return MAP[field] || null;
  }

  function updateProgress(habits) {
    const done  = habits.filter(h => h.completed_today).length;
    const total = habits.length;
    const pct   = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-label").textContent = `${done} / ${total} done`;
  }

  function renderHabits(habits) {
    const list    = document.getElementById("habits-list");
    const empty   = document.getElementById("habits-empty");
    const loading = document.getElementById("habits-loading");

    loading.classList.add("hidden");

    if (!habits.length) {
      empty.classList.remove("hidden");
      list.classList.add("hidden");
      return;
    }

    empty.classList.add("hidden");
    list.classList.remove("hidden");
    list.innerHTML = "";

    habits.forEach(habit => {
      const li = document.createElement("li");
      li.className = "habit-item" + (habit.completed_today ? " done" : "");
      li.dataset.id = habit.id;

      const bio = habit.bio_age_field ? bioLabel(habit.bio_age_field) : null;
      const badgeHtml = bio
        ? `<span class="habit-badge habit-badge-${bio[1]}">${bio[0]}</span>`
        : "";

      li.innerHTML = `
        <button class="check-btn" onclick="toggleHabit('${habit.id}')"
          title="${habit.completed_today ? 'Mark incomplete' : 'Mark complete'}">
          ${habit.completed_today ? "✅" : "⬜"}
        </button>
        <span class="habit-emoji">${escapeHtml(habit.emoji || "✅")}</span>
        <div class="habit-meta">
          <span class="habit-name">${escapeHtml(habit.name)}</span>
          ${badgeHtml}
        </div>
        <div class="habit-actions">
          <button class="btn btn-ghost btn-sm" onclick="showStats('${habit.id}')">📊</button>
          <button class="btn btn-ghost btn-sm" onclick="showStreak('${habit.id}', '${escapeHtml(habit.name)}')">🔥</button>
          <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteHabit('${habit.id}')">🗑</button>
        </div>
      `;
      list.appendChild(li);
    });

    updateProgress(habits);
  }

  // ── API actions ─────────────────────────────────────────
  let habitsCache = [];

  async function loadHabits() {
    try {
      habitsCache = await apiFetch("/habits", "GET");
      renderHabits(habitsCache);
    } catch (err) {
      if (err.status === 401) {
        logout();
      } else {
        document.getElementById("habits-loading").textContent = "Failed to load habits.";
      }
    }
  }

  async function toggleHabit(habitId) {
    try {
      const result = await apiFetch(`/habits/${habitId}/check`, "POST");
      const habit  = habitsCache.find(h => h.id === habitId);
      if (habit) habit.completed_today = result.completed;
      renderHabits(habitsCache);
    } catch (err) {
      alert("Could not update habit: " + (err.message || "unknown error"));
    }
  }

  async function deleteHabit(habitId) {
    if (!confirm("Delete this habit and all its history?")) return;
    try {
      await apiFetch(`/habits/${habitId}`, "DELETE");
      habitsCache = habitsCache.filter(h => h.id !== habitId);
      renderHabits(habitsCache);
    } catch (err) {
      alert("Could not delete habit: " + (err.message || "unknown error"));
    }
  }

  async function showStreak(habitId, habitName) {
    try {
      const data = await apiFetch(`/habits/${habitId}/streak`, "GET");
      document.getElementById("modal-habit-name").textContent = habitName;
      document.getElementById("modal-streak-count").textContent = data.streak;
      document.getElementById("modal-streak-sub").textContent =
        data.streak === 1 ? "day in a row" :
        data.streak === 0 ? "Start today!" : "days in a row 🎉";
      document.getElementById("streak-modal").classList.remove("hidden");
    } catch (err) {
      alert("Could not load streak.");
    }
  }

  function closeStreakModal(e) {
    if (!e || e.target === document.getElementById("streak-modal") ||
        e.currentTarget.classList.contains("modal-close")) {
      document.getElementById("streak-modal").classList.add("hidden");
    }
  }

  async function showStats(habitId) {
    try {
      const data = await apiFetch(`/habits/${habitId}/stats`, "GET");
      document.getElementById("stats-modal-emoji").textContent = data.emoji || "✅";
      document.getElementById("stats-modal-name").textContent  = data.name;
      document.getElementById("stat-streak").textContent = data.streak;
      document.getElementById("stat-total").textContent  = data.total_completions;
      document.getElementById("stat-time").textContent   = data.total_minutes || 0;

      // Build 14-day mini calendar
      const cal = document.getElementById("stat-calendar");
      const doneSet = new Set((data.recent_logs || []).map(l => l.date));
      const days = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d);
      }
      cal.innerHTML = days.map(d => {
        const iso   = d.toISOString().slice(0, 10);
        const label = d.toLocaleDateString("en-US", { day: "numeric" });
        const done  = doneSet.has(iso);
        return `<div class="cal-day ${done ? "done" : "missed"}" title="${iso}">${label}</div>`;
      }).join("");

      document.getElementById("stats-modal").classList.remove("hidden");
    } catch (err) {
      alert("Could not load stats.");
    }
  }

  function closeStatsModal(e) {
    if (!e || e.target === document.getElementById("stats-modal") ||
        e.currentTarget.classList.contains("modal-close")) {
      document.getElementById("stats-modal").classList.add("hidden");
    }
  }

  function logout() {
    localStorage.removeItem("habit_token");
    localStorage.removeItem("habit_user");
    window.location.href = "index.html";
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ── Boot ────────────────────────────────────────────────
  buildPanels();
  loadHabits();
</script>
</body>
</html>
